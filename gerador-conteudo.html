<title>Gerador de Conteudo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── TOKENS ── */
:root {
  --bg:        #F7F6F3;
  --surface:   #FFFFFF;
  --card:      #F2F1EE;
  --border:    #E4E0D8;
  --border-hi: #C8C3BB;
  --ink:       #19181C;
  --ink-2:     #6B6573;
  --ink-3:     #B0ABB8;
  --pink:      #E8186D;
  --pink-bg:   rgba(232,24,109,.07);
  --pink-bdr:  rgba(232,24,109,.22);
  --green:     #0A7A42;
  --amber:     #A05E08;
  --blue:      #2545B8;
  --orange:    #C05510;
  --font:      'Barlow', system-ui, sans-serif;
  --serif:     'DM Serif Display', Georgia, serif;
  --r:         3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #111016;
    --surface:   #18171C;
    --card:      #201F26;
    --border:    rgba(220,215,235,.07);
    --border-hi: rgba(220,215,235,.16);
    --ink:       #E2DFF0;
    --ink-2:     #7E7A90;
    --ink-3:     #3E3A4A;
    --pink:      #F03080;
    --pink-bg:   rgba(240,48,128,.08);
    --pink-bdr:  rgba(240,48,128,.24);
    --green:     #1EC978;
    --amber:     #C8962A;
    --blue:      #607AE8;
    --orange:    #E07840;
  }
}
:root[data-theme="dark"] {
  --bg:        #111016;
  --surface:   #18171C;
  --card:      #201F26;
  --border:    rgba(220,215,235,.07);
  --border-hi: rgba(220,215,235,.16);
  --ink:       #E2DFF0;
  --ink-2:     #7E7A90;
  --ink-3:     #3E3A4A;
  --pink:      #F03080;
  --pink-bg:   rgba(240,48,128,.08);
  --pink-bdr:  rgba(240,48,128,.24);
  --green:     #1EC978;
  --amber:     #C8962A;
  --blue:      #607AE8;
  --orange:    #E07840;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}

/* ── APP SHELL ── */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: 44px auto 1fr 62px;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.t-wordmark {
  font-family: var(--serif);
  font-size: 17px;
  color: var(--pink);
  letter-spacing: -.01em;
}
.t-pipe {
  width: 1px;
  height: 14px;
  background: var(--border-hi);
}
.t-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--ink-2);
  flex: 1;
}
.t-upd {
  font-size: 10px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.t-btn {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--border-hi);
  padding: 4px 11px;
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color .12s, color .12s;
  display: flex; align-items: center; gap: 5px;
}
.t-btn:hover { border-color: var(--pink); color: var(--pink); }
.t-btn.loading { opacity: .38; pointer-events: none; }
.spin { display: inline-block; }
.t-btn.loading .spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── HERO STRIP ── */
.hero {
  padding: 16px 28px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 20px;
  flex-wrap: wrap;
}
.hero-name {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(24px, 3.2vw, 40px);
  color: var(--ink);
  line-height: 1;
  letter-spacing: -.02em;
  white-space: nowrap;
}
.hero-sub {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.hero-role {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--pink);
}
.hero-sep { color: var(--border-hi); }
.hero-line {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  font-style: italic;
}

/* ── BODY GRID ── */
.body-grid {
  display: grid;
  grid-template-columns: 1fr 252px;
  min-height: 0;
  overflow: hidden;
}

/* ── TOPICS PANEL ── */
.topics-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.f-pill {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid var(--border-hi);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
  flex-shrink: 0;
}
.f-pill:hover { background: var(--card); color: var(--ink); }
.f-pill.active { background: var(--pink); border-color: var(--pink); color: #fff; }

.topics-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
.tb-count {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.tb-hint {
  font-size: 11px;
  color: var(--ink-3);
}

.topics-scroll {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}

/* ── TOPIC ROW ── */
.topic-row {
  display: grid;
  grid-template-columns: 42px 20px 1fr 62px;
  align-items: center;
  gap: 0;
  padding: 10px 16px 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
  user-select: none;
  background: var(--surface);
}
.topic-row:hover { background: var(--bg); }
.topic-row.selected { background: var(--pink-bg); }

.tr-score {
  font-size: 20px;
  font-weight: 900;
  font-style: italic;
  font-variant-numeric: tabular-nums;
  text-align: center;
  line-height: 1;
  color: var(--ink-3);
  padding: 0 8px 0 16px;
  flex-shrink: 0;
}
.tr-score.hi  { color: var(--pink); }
.tr-score.mid { color: var(--amber); }
.tr-score.lo  { color: var(--blue); }
.topic-row.selected .tr-score { color: var(--pink); }

.tr-ck {
  width: 16px;
  height: 16px;
  border-radius: 2px;
  border: 1.5px solid var(--border-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #fff;
  flex-shrink: 0;
  transition: all .1s;
}
.topic-row.selected .tr-ck {
  background: var(--pink);
  border-color: var(--pink);
}

.tr-body {
  padding: 0 12px;
  min-width: 0;
}
.tr-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.38;
  margin-bottom: 4px;
}
.tr-tags {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.tr-live {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--green);
  animation: blink 2.2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
.tr-src-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .05em;
  padding: 1px 5px;
  border-radius: 2px;
}
.badge-google    { background: rgba(10,122,66,.1);   color: var(--green); }
.badge-exame     { background: rgba(160,94,8,.1);    color: var(--amber); }
.badge-meioem    { background: rgba(192,85,16,.1);   color: var(--orange); }
.badge-infomoney { background: rgba(37,69,184,.1);   color: var(--blue); }
.badge-curado    { background: rgba(232,24,109,.09); color: var(--pink); }
.tr-zone-pill {
  font-size: 9px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 20px;
  letter-spacing: .02em;
}

.tr-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  padding-right: 0;
  flex-shrink: 0;
}
.tr-vlabel {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}
.tr-vbar {
  width: 48px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.tr-vfill {
  height: 100%;
  border-radius: 2px;
  transition: width .3s;
}

/* Skeleton rows */
.skel-row {
  display: grid;
  grid-template-columns: 42px 20px 1fr 62px;
  align-items: center;
  padding: 10px 16px 10px 0;
  border-bottom: 1px solid var(--border);
  gap: 0;
}
.skel {
  background: var(--card);
  border-radius: 2px;
  animation: sh 1.4s ease infinite;
}
@keyframes sh { 0%,100%{opacity:.35} 50%{opacity:.75} }

/* ── SIDEBAR ── */
.sidebar {
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: var(--border-hi) transparent;
}
.sb-sec {
  padding: 16px;
}
.sb-sec + .sb-sec {
  border-top: 1px solid var(--border);
}
.sb-lbl {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 10px;
}

/* Zone buttons */
.zones-list { display: flex; flex-direction: column; gap: 1px; }
.zone-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: var(--r);
  cursor: pointer;
  transition: background .1s;
  border: none;
  width: 100%;
  background: transparent;
  text-align: left;
  font-family: var(--font);
  border-left: 2px solid transparent;
}
.zone-btn:hover { background: var(--card); }
.zone-btn.active { background: var(--card); border-left-color: var(--pink); }
.z-pip {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.z-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-2);
  flex: 1;
  line-height: 1.3;
}
.zone-btn.active .z-name { color: var(--ink); }
.z-ct {
  font-size: 15px;
  font-weight: 900;
  font-style: italic;
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
}
.zone-btn.active .z-ct { color: var(--ink-2); }

/* Source status */
.src-list { display: flex; flex-direction: column; gap: 5px; }
.src-item { display: flex; align-items: center; gap: 7px; }
.s-led {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ink-3);
  flex-shrink: 0;
}
.s-led.ok   { background: var(--green); }
.s-led.err  { background: var(--orange); }
.s-led.pend { background: var(--amber); animation: blink 1s ease-in-out infinite; }
.s-name { flex: 1; font-size: 11px; color: var(--ink-2); font-weight: 500; }
.s-ct {
  font-size: 11px;
  font-weight: 800;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* ── COMMAND BAR ── */
.cmd-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  padding-bottom: env(safe-area-inset-bottom, 0);
  background: var(--surface);
  border-top: 2px solid var(--border);
}
.cmd-steps {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.cmd-step {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
  color: var(--ink-3);
  flex-shrink: 0;
  transition: all .15s;
}
.step-dot.done {
  background: var(--pink);
  border-color: var(--pink);
  color: #fff;
}
.step-txt {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  transition: color .15s;
  white-space: nowrap;
}
.step-txt.done { color: var(--ink); }
.cmd-div {
  color: var(--border-hi);
  font-size: 14px;
}
.cmd-zone-sel {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  background: var(--card);
  border: 1px solid var(--border-hi);
  color: var(--ink-2);
  padding: 7px 10px;
  border-radius: var(--r);
  outline: none;
  cursor: pointer;
  max-width: 200px;
}
.cmd-zone-sel option { background: var(--card); }
.cmd-cta {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .05em;
  background: var(--pink);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 9px 20px;
  cursor: pointer;
  transition: opacity .12s, transform .08s;
  white-space: nowrap;
}
.cmd-cta:hover { opacity: .88; transform: translateY(-1px); }
.cmd-cta:disabled { background: var(--border-hi); cursor: not-allowed; transform: none; opacity: 1; color: var(--ink-3); }

/* ── OUTPUT OVERLAY ── */
.out-overlay {
  position: fixed; inset: 0;
  background: rgba(10,8,16,.75);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.out-overlay[hidden] { display: none !important; }
.out-sheet {
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  width: 100%;
  max-width: 940px;
  max-height: 88vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.out-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.out-title {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink);
  flex: 1;
}
.out-close {
  width: 28px;
  height: 28px;
  border-radius: var(--r);
  background: var(--card);
  border: 1px solid var(--border-hi);
  color: var(--ink-2);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  transition: background .1s;
}
.out-close:hover { background: var(--border); color: var(--ink); }
.out-ctx {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
}
.ctx-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  background: var(--card);
  color: var(--ink-2);
  border: 1px solid var(--border-hi);
}
.ctx-tag-pink {
  background: var(--pink-bg);
  color: var(--pink);
  border-color: var(--pink-bdr);
}
.ideas-grid {
  padding: 20px 24px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.idea-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.idea-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}
.idea-ico { font-size: 15px; }
.idea-plat {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-2);
  flex: 1;
}
.idea-fmt {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  background: var(--pink-bg);
  color: var(--pink);
  border: 1px solid var(--pink-bdr);
}
.idea-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.idea-hook {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.45;
}
.idea-hook::before { content: '\201C'; color: var(--pink); }
.idea-hook::after  { content: '\201D'; color: var(--pink); }
.idea-desc { font-size: 12px; color: var(--ink-2); line-height: 1.75; }
.idea-cta {
  font-size: 11px;
  font-weight: 800;
  color: var(--pink);
  letter-spacing: .01em;
  display: flex;
  align-items: center;
  gap: 5px;
}
.idea-cta::before { content: '→'; }
.idea-ref {
  font-size: 10px;
  color: var(--ink-3);
  font-style: italic;
  border-top: 1px solid var(--border);
  padding-top: 9px;
}
.out-regen-wrap { padding: 4px 24px 24px; }
.out-regen {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--ink-2);
  padding: 10px;
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color .12s, color .12s;
  width: 100%;
}
.out-regen:hover { border-color: var(--pink); color: var(--pink); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 74px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  font-size: 12px;
  font-weight: 700;
  padding: 7px 16px;
  border-radius: 20px;
  z-index: 300;
  opacity: 0;
  transition: opacity .22s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── EMPTY ── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--ink-2);
}
.empty-icon { font-size: 28px; margin-bottom: 10px; }
.empty-h { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 3px; }
.empty-p { font-size: 12px; }

/* ── RESPONSIVE ── */
@media (max-width: 740px) {
  .body-grid { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .hero { padding: 12px 16px 10px; }
  .filter-row, .topics-bar { padding-inline: 12px; }
  .cmd-bar { gap: 8px; padding-inline: 12px; }
  .cmd-zone-sel { max-width: 130px; font-size: 11px; }
  .ideas-grid { grid-template-columns: 1fr; padding: 14px; }
  .out-head, .out-ctx, .out-regen-wrap { padding-inline: 14px; }
  .cmd-steps { gap: 5px; }
  .step-txt { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<!-- TOPBAR -->
<header class="topbar">
  <span class="t-wordmark">Sancho</span>
  <span class="t-pipe"></span>
  <span class="t-label">Gerador de Conteudo</span>
  <span class="t-upd" id="last-updated"></span>
  <button class="t-btn" id="refresh-btn"><span class="spin">↻</span> Atualizar</button>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-name">Wladson Sidney</div>
  <div class="hero-sub">
    <span class="hero-role">Estrategista de Personalidades</span>
    <span class="hero-sep">·</span>
    <span class="hero-line">Tornar os competentes conhecidos.</span>
  </div>
</div>

<!-- BODY -->
<div class="body-grid">

  <!-- Topics panel -->
  <div class="topics-panel">
    <div class="filter-row" id="source-filter">
      <button class="f-pill active" data-filter="all">Todos</button>
      <button class="f-pill" data-filter="google">Google Trends</button>

  marca:        ['marca pessoal','branding pessoal','personal branding','identidade','portfolio','storytelling','narrativa','comunicacao','imagem','posicionamento','pitch'],
  lideranca:    ['talento','competencia','habilidade','soft skill','hard skill','desenvolvimento','treinamento','capacitacao','gestao de pessoas','equipe','time','colaborador','cultura'],

const CURATED = [
  { title:'Personal branding sem autopromoção: o paradoxo que vira viral',         source:'curado', tags:['marca pessoal','autoridade'], zone:'marca',        virality:95, live:false },
  { title:'Empreendedor invisivel: competentes que o mercado ainda nao descobriu',  source:'curado', tags:['visibilidade','carreira'],   zone:'visibilidade',  virality:91, live:false },

  { title:'Recolocacao em 2026: o que mudou e o que ainda ninguem te contou',       source:'curado', tags:['recolocacao','carreira'],    zone:'carreiras',     virality:90, live:false },
  { title:'LinkedIn virou vitrine. Mas quem realmente converte?',                   source:'curado', tags:['linkedin','conversao'],      zone:'visibilidade',  virality:88, live:false },
  { title:'Gestao de talentos que as empresas querem mas raramente encontram',       source:'curado', tags:['talentos','gestao'],         zone:'lideranca',     virality:82, live:false },
  { title:'Por que profissionais competentes perdem para os bem relacionados',       source:'curado', tags:['competencia','rede'],        zone:'networking',    virality:93, live:false },
  { title:'O capital social que ninguem te ensina na faculdade',                    source:'curado', tags:['capital social','aprendizado'], zone:'carreiras', virality:85, live:false },

];

const SOURCE_META = {
  'google-trends-br': { label:'Google Trends BR', badgeCls:'badge-google',    badge:'🔥 Trends', filter:'google'  },
  'exame-carreira':   { label:'Exame · Carreira', badgeCls:'badge-exame',     badge:'💼 Exame',  filter:'portais' },
  'meioemensagem':    { label:'Meio e Mensagem',  badgeCls:'badge-meioem',    badge:'📣 M&M',    filter:'portais' },
  'infomoney':        { label:'InfoMoney',         badgeCls:'badge-infomoney', badge:'📊 Info',   filter:'portais' },
  'curado':           { label:'Curado Sancho',     badgeCls:'badge-curado',    badge:'✦ Sancho',  filter:'curado'  },
};

const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const SOURCES = [
  {
    id:'google-trends-br', label:'Google Trends BR', filter:'google',
    url: RSS2JSON + encodeURIComponent('https://trends.google.com/trends/trendingsearches/daily/rss?geo=BR'),
    parse: items => items.map((item, i) => ({
      title: clean(item.title), tags: tagsFromDesc(item.description||''),
      viralityBase: Math.max(70, 98 - i*2), source:'google-trends-br', live:true, link:item.link,
    })),
  },
  {
    id:'exame-carreira', label:'Exame · Carreira', filter:'portais',
    url: RSS2JSON + encodeURIComponent('https://exame.com/feed/'),
    parse: items => items
      .filter(i => has(i.title, ['carreira','mercado','negocio','emprego','trabalho','empreendedor','talento','lideranca','executivo','rede']))
      .slice(0,8).map(item => ({
        title: clean(item.title), tags: guessTagsFromTitle(item.title),
        viralityBase: 75 + rnd(12), source:'exame-carreira', live:true, link:item.link,
      })),
  },
  {
    id:'meioemensagem', label:'Meio e Mensagem', filter:'portais',
    url: RSS2JSON + encodeURIComponent('https://www.meioemensagem.com.br/feed/'),
    parse: items => items
      .filter(i => has(i.title, ['marca','comunicacao','posicionamento','branding','marketing','carreira','influencia','reputacao']))
      .slice(0,6).map(item => ({
        title: clean(item.title), tags: guessTagsFromTitle(item.title),
        viralityBase: 72 + rnd(10), source:'meioemensagem', live:true, link:item.link,
      })),
  },
  {
    id:'infomoney', label:'InfoMoney', filter:'portais',
    url: RSS2JSON + encodeURIComponent('https://www.infomoney.com.br/feed/'),
    parse: items => items
      .filter(i => has(i.title, ['carreira','emprego','salario','empresa','trabalho','mercado','gestao']))
      .slice(0,6).map(item => ({
        title: clean(item.title), tags: guessTagsFromTitle(item.title),
        viralityBase: 70 + rnd(12), source:'infomoney', live:true, link:item.link,
      })),
  },
];

/* HELPERS */
function clean(s) { return (s||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim(); }
function rnd(n)   { return Math.floor(Math.random()*n); }
function has(text, kws) { const t=(text||'').toLowerCase(); return kws.some(k=>t.includes(k)); }
function tagsFromDesc(d) {
  return clean(d).split(/[,;\n]+/).map(s=>s.trim()).filter(s=>s.length>2&&s.length<32).slice(0,3);
}
function guessTagsFromTitle(title) {
  const t=(title||'').toLowerCase();
  const map=[['linkedin','linkedin'],['carreira','carreira'],['emprego','emprego'],['marca','branding'],
    ['lideranca','lideranca'],['networking','networking'],['talento','talentos'],
    ['executivo','c-level'],['empreendedor','empreend'],['mercado','mercado'],
    ['comunicacao','comunicacao'],['trabalho','trabalho'],['salario','remuneracao']];
  return map.filter(([k])=>t.includes(k)).map(([,v])=>v).slice(0,3);
}
function classifyZone(title, tags) {
  const text=((title||'')+' '+(tags||[]).join(' ')).toLowerCase();
  let best=null, top=0;
  for(const [zid,kws] of Object.entries(ZONE_KW)){
    const score=kws.filter(k=>text.includes(k)).length;
    if(score>top){top=score;best=zid;}
  }
  return best||'carreiras';
}

/* STATE */
let allTopics      = [];
let selectedTopics = new Set();
let activeFilter   = 'all';
let activeZone     = '';
let srcStatuses    = {};
let nextId         = 1;

/* FETCH */
async function fetchSource(src) {
  setSrcStatus(src.id, 'pend', 0);
  try {
    const res  = await fetch(src.url, { signal: AbortSignal.timeout(8000) });
    const json = await res.json();
    if(json.status!=='ok' || !Array.isArray(json.items)) throw new Error();
    const topics = src.parse(json.items).map(p => ({
      id: nextId++, title: p.title, source: p.source,
      tags: p.tags||[], zone: classifyZone(p.title, p.tags),
      virality: p.viralityBase + rnd(4), live: p.live, link: p.link||null,
    }));
    setSrcStatus(src.id, 'ok', topics.length);
    return topics;
  } catch(e) {
    setSrcStatus(src.id, 'err', 0);
    return [];
  }
}

async function loadAllTopics() {
  document.getElementById('refresh-btn').classList.add('loading');
  renderSkeletons();
  allTopics = CURATED.map(t=>({...t, id:nextId++}));
  setSrcStatus('curado','ok',CURATED.length);

  const results = await Promise.allSettled(SOURCES.map(s=>fetchSource(s)));
  results.forEach(r=>{ if(r.status==='fulfilled') allTopics=[...allTopics,...r.value]; });

  const seen=new Set();
  allTopics=allTopics.filter(t=>{ const k=t.title.toLowerCase().slice(0,40); if(seen.has(k))return false; seen.add(k); return true; });

  ZONES.forEach(z=>{ z.count=allTopics.filter(t=>t.zone===z.id).length; });
  renderZones(); renderTopics(); updateGenBtn();

  const now=new Date();
  document.getElementById('last-updated').textContent=
    `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  document.getElementById('refresh-btn').classList.remove('loading');
  toast(`${allTopics.length} tendencias carregadas`);
}

function setSrcStatus(id, status, count) {
  srcStatuses[id]={status,count};
  renderSrcStatus();
}

function renderSrcStatus() {
  const container = document.getElementById('source-status');
  const all = [{id:'curado',label:'Curado Sancho'}, ...SOURCES.map(s=>({id:s.id,label:s.label}))];
  const rows = all.map(s=>{
    const st = srcStatuses[s.id]||{status:'pend',count:0};
    return `<div class="src-item">
      <span class="s-led ${st.status}"></span>
      <span class="s-name">${s.label}</span>
      ${st.status==='ok'?`<span class="s-ct">${st.count}</span>`:''}
    </div>`;
  }).join('');
  container.innerHTML = `<div class="sb-lbl">Fontes</div><div class="src-list">${rows}</div>`;
}

/* RENDER */
function renderZones() {
  const list   = document.getElementById('zones-list');

  list.innerHTML   = '';
  select.innerHTML = '<option value="">Zona de Genialidade</option>';
  ZONES.forEach(z=>{
    const btn = document.createElement('button');
    btn.className = 'zone-btn' + (activeZone===z.id?' active':'');
    btn.dataset.id = z.id;
    btn.innerHTML = `
      <span class="z-pip" style="background:${z.color}"></span>
      <span class="z-name">${z.label}</span>
      <span class="z-ct">${z.count}</span>
    `;
    btn.addEventListener('click',()=>{
      activeZone = z.id;
      document.querySelectorAll('.zone-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      select.value = z.id;
      updateGenBtn();
    });
    list.appendChild(btn);

    const opt = document.createElement('option');
    opt.value = z.id; opt.textContent = z.label;
    if(activeZone===z.id) opt.selected = true;
    select.appendChild(opt);
  });
}

function renderSkeletons() {
  const grid = document.getElementById('topics-grid');
  grid.innerHTML = Array(12).fill('').map(()=>`
    <div class="skel-row">
      <div class="skel" style="height:20px;width:30px;margin:0 auto"></div>
      <div class="skel" style="height:14px;width:14px;border-radius:2px"></div>
      <div style="padding:0 12px;display:flex;flex-direction:column;gap:5px">
        <div class="skel" style="height:13px;width:85%"></div>
        <div class="skel" style="height:10px;width:55%"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-right:0">
        <div class="skel" style="height:9px;width:40px"></div>
        <div class="skel" style="height:2px;width:48px"></div>
      </div>
    </div>`).join('');
  document.getElementById('topic-count').textContent = 'Carregando...';
}

function renderTopics() {
  const grid = document.getElementById('topics-grid');
  const filtered = allTopics.filter(t=>{
    if(activeFilter==='all') return true;
    const m = SOURCE_META[t.source];
    return m && m.filter===activeFilter;
  });
  document.getElementById('topic-count').textContent = `${filtered.length} topicos`;
  grid.innerHTML = '';

  if(!filtered.length){
    grid.innerHTML=`<div class="empty-state">
      <div class="empty-icon">📡</div>
      <div class="empty-h">Nenhum topico encontrado</div>
      <div class="empty-p">Tente outro filtro ou atualize as tendencias.</div>
    </div>`;
    return;
  }

  [...filtered].sort((a,b)=>b.virality-a.virality).forEach(t=>{
    const sel   = selectedTopics.has(t.id);
    const meta  = SOURCE_META[t.source]||SOURCE_META['curado'];
    const zone  = ZONES.find(z=>z.id===t.zone);
    const scoreClass = t.virality>=90?'hi':t.virality>=80?'mid':'lo';
    const fillColor  = t.virality>=90?'var(--pink)':t.virality>=80?'var(--amber)':'var(--blue)';
    const vl         = t.virality>=90?'Viral':t.virality>=80?'Em alta':'Crescendo';

    const row = document.createElement('div');
    row.className = 'topic-row' + (sel?' selected':'');
    row.dataset.id = t.id;
    row.innerHTML = `
      <div class="tr-score ${scoreClass}">${t.virality}</div>
      <div class="tr-ck">${sel?'✓':''}</div>
      <div class="tr-body">
        <div class="tr-title">${t.title}</div>
        <div class="tr-tags">
          ${t.live?'<span class="tr-live"></span>':''}
          <span class="tr-src-badge ${meta.badgeCls}">${meta.badge}</span>
          ${zone?`<span class="tr-zone-pill" style="background:${zone.color}18;color:${zone.color};border:1px solid ${zone.color}28">✦ ${zone.label}</span>`:''}
        </div>
      </div>
      <div class="tr-right">
        <span class="tr-vlabel">${vl}</span>
        <div class="tr-vbar"><div class="tr-vfill" style="width:${t.virality}%;background:${fillColor}"></div></div>
      </div>`;

    row.addEventListener('click',()=>{
      if(selectedTopics.has(t.id)){
        selectedTopics.delete(t.id);
        row.classList.remove('selected');
        row.querySelector('.tr-ck').textContent='';
        row.querySelector('.tr-score').className='tr-score '+scoreClass;
      } else {
        selectedTopics.add(t.id);
        row.classList.add('selected');
        row.querySelector('.tr-ck').textContent='✓';
      }
      updateGenBtn();
    });
    grid.appendChild(row);
  });
}

/* GENERATE */
function generateContent() {
  const topics = allTopics.filter(t=>selectedTopics.has(t.id));
  const zone   = ZONES.find(z=>z.id===activeZone);
  const pool   = TEMPLATES[activeZone]||TEMPLATES.carreiras;

  const ctx = document.getElementById('out-ctx');
  ctx.innerHTML=`
    <span class="ctx-tag">Wladson Sidney</span>
    <span class="ctx-tag ctx-tag-pink">✦ ${zone.label}</span>
    ${topics.map(t=>`<span class="ctx-tag">📌 ${t.title.slice(0,40)}${t.title.length>40?'...':''}</span>`).join('')}
  `;

  const grid = document.getElementById('ideas-grid');
  grid.innerHTML = '';

  topics.forEach(topic=>{
    const shuffled = [...pool].sort(()=>Math.random()-.5);
    shuffled.slice(0, Math.min(2, shuffled.length)).forEach(tmpl=>{
      const card = document.createElement('div');
      card.className = 'idea-card';
      const hook = tmpl.hook(topic.title);
      const desc = tmpl.desc(topic.title, zone.label);
      const meta = SOURCE_META[topic.source]||SOURCE_META['curado'];
      card.innerHTML=`
        <div class="idea-head">
          <span class="idea-ico">${tmpl.icon}</span>
          <span class="idea-plat">${tmpl.platform}</span>
          <span class="idea-fmt">${tmpl.format}</span>
        </div>
        <div class="idea-body">
          <div class="idea-hook">${hook}</div>
          <div class="idea-desc">${desc}</div>
          <div class="idea-cta">${tmpl.cta}</div>
          <div class="idea-ref">Topico: ${topic.title.slice(0,55)}${topic.title.length>55?'...':''} · <span class="tr-src-badge ${meta.badgeCls}" style="font-size:9px">${meta.badge}</span></div>
        </div>`;
      grid.appendChild(card);
    });
  });

  document.getElementById('out-overlay').hidden = false;
  document.querySelector('.out-sheet').scrollTop = 0;
}

/* UI */
function updateGenBtn() {
  const btn  = document.getElementById('gen-btn');
  const d1   = document.getElementById('step1-dot');
  const t1   = document.getElementById('step1-txt');
  const d2   = document.getElementById('step2-dot');
  const t2   = document.getElementById('step2-txt');
  const n    = selectedTopics.size;

  if(n>0){ d1.classList.add('done'); d1.textContent='✓'; t1.classList.add('done'); t1.textContent=`${n} topico${n>1?'s':''}`; }
  else    { d1.classList.remove('done'); d1.textContent='1'; t1.classList.remove('done'); t1.textContent='Selecione topicos'; }

  const zone = ZONES.find(z=>z.id===activeZone);
  if(zone){ d2.classList.add('done'); d2.textContent='✓'; t2.classList.add('done'); t2.textContent=zone.label; }
  else    { d2.classList.remove('done'); d2.textContent='2'; t2.classList.remove('done'); t2.textContent='Escolha a zona'; }

  btn.disabled = !(n>0 && activeZone);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2800);
}

document.getElementById('source-filter').addEventListener('click', e=>{
  const btn = e.target.closest('.f-pill'); if(!btn) return;
  document.querySelectorAll('.f-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderTopics();
});

document.getElementById('zone-select').addEventListener('change', e=>{
  activeZone = e.target.value;
  document.querySelectorAll('.zone-btn').forEach(b=>b.classList.toggle('active', b.dataset.id===activeZone));
  updateGenBtn();
});

document.getElementById('gen-btn').addEventListener('click', generateContent);
document.getElementById('out-regen').addEventListener('click', generateContent);
document.getElementById('refresh-btn').addEventListener('click', loadAllTopics);
document.getElementById('out-close').addEventListener('click', ()=>{ document.getElementById('out-overlay').hidden=true; });
document.getElementById('out-overlay').addEventListener('click', e=>{ if(e.target.id==='out-overlay') document.getElementById('out-overlay').hidden=true; });

/* INIT */
CURATED.forEach(t=>allTopics.push({...t, id:nextId++}));
ZONES.forEach(z=>{ z.count=allTopics.filter(t=>t.zone===z.id).length; });
renderZones(); renderTopics(); updateGenBtn(); renderSrcStatus();
loadAllTopics();
</script>
