<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Conteudo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: #F0F2F5;
  color: #111318;
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; }

:root {
  --bg:        #F0F2F5;
  --surface:   #FFFFFF;
  --panel:     #FAFBFC;
  --border:    #E2E5EA;
  --border-hi: #CBD0D8;
  --ink:       #111318;
  --ink-2:     #5A6172;
  --ink-3:     #9BA3B0;
  --pink:      #D91460;
  --pink-lt:   rgba(217,20,96,.08);
  --pink-bdr:  rgba(217,20,96,.2);
  --green:     #0F7A3D;
  --green-lt:  rgba(15,122,61,.1);
  --amber:     #996008;
  --amber-lt:  rgba(153,96,8,.1);
  --blue:      #1E3FAA;
  --blue-lt:   rgba(30,63,170,.09);
  --orange:    #B84C10;
  --orange-lt: rgba(184,76,16,.1);
  --r:         4px;
  --r2:        6px;
}

/* ── APP SHELL ── */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: 44px 1fr;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.t-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 16px;
  border-right: 1px solid var(--border);
  margin-right: 14px;
}
.t-logo-sq {
  width: 22px; height: 22px;
  border-radius: 4px;
  background: var(--pink);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.t-name { font-size: 13px; font-weight: 700; color: var(--ink); }
.t-title { font-size: 12px; font-weight: 500; color: var(--ink-2); flex: 1; }
.t-upd { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: 12px; }
.t-btn {
  font-size: 12px; font-weight: 600; color: var(--ink-2);
  background: transparent; border: 1px solid var(--border-hi);
  padding: 5px 11px; border-radius: var(--r);
  transition: background .12s, color .12s;
  display: flex; align-items: center; gap: 5px;
}
.t-btn:hover { background: var(--bg); color: var(--ink); }
.t-btn.loading { opacity: .38; pointer-events: none; }
.spin { display: inline-block; }
.t-btn.loading .spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── BODY ── */
.body {
  display: grid;
  grid-template-columns: 220px 1fr 340px;
  min-height: 0; overflow: hidden;
}

/* ── ZONE PANEL ── */
.zone-panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
}
.panel-sub { font-size: 11px; color: var(--ink-2); margin-top: 2px; }

.zones-list {
  padding: 8px; display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto; flex: 1;
}
.zone-btn {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 10px; border-radius: var(--r2);
  border: 1.5px solid transparent; background: transparent;
  text-align: left; width: 100%;
  transition: background .1s, border-color .1s;
}
.zone-btn:hover { background: var(--bg); }
.zone-btn.active { background: var(--pink-lt); border-color: var(--pink-bdr); }
.z-icon {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; margin-top: 1px;
  background: var(--bg); transition: background .1s;
}
.zone-btn.active .z-icon { background: rgba(217,20,96,.12); }
.z-info { display: flex; flex-direction: column; min-width: 0; }
.z-name { font-size: 12px; font-weight: 600; color: var(--ink-2); line-height: 1.3; }
.zone-btn.active .z-name { color: var(--pink); }
.z-ct { font-size: 10px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 1px; }

.zone-divider { margin: 8px 14px; border: none; border-top: 1px solid var(--border); }

.src-section { padding: 8px 14px 12px; flex-shrink: 0; }
.src-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.src-item { display: flex; align-items: center; gap: 7px; }
.s-led { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
.s-led.ok   { background: var(--green); }
.s-led.err  { background: var(--orange); }
.s-led.pend { background: var(--amber); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.s-name { flex: 1; font-size: 11px; color: var(--ink-2); font-weight: 500; }
.s-ct { font-size: 11px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ── TOPICS PANEL ── */
.topics-panel {
  display: flex; flex-direction: column;
  min-height: 0; background: var(--panel);
  border-right: 1px solid var(--border);
}
.filter-row {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
  overflow-x: auto; scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.f-btn {
  font-size: 11px; font-weight: 600; padding: 4px 10px;
  border-radius: var(--r); border: 1px solid transparent;
  background: transparent; color: var(--ink-2);
  transition: all .1s; white-space: nowrap; flex-shrink: 0;
}
.f-btn:hover { background: var(--bg); color: var(--ink); }
.f-btn.active { background: var(--surface); border-color: var(--border-hi); color: var(--ink); font-weight: 700; }

.topics-meta {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 14px; border-bottom: 1px solid var(--border);
  background: var(--panel); flex-shrink: 0;
}
.tm-count { font-size: 11px; font-weight: 600; color: var(--ink-2); flex: 1; font-variant-numeric: tabular-nums; }
.tm-sel { font-size: 11px; font-weight: 700; color: var(--pink); }

.topics-scroll {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent;
}

/* ── TOPIC ROW ── */
.topic-row {
  display: grid;
  grid-template-columns: 36px 16px 1fr 52px;
  align-items: center; gap: 0;
  padding: 9px 12px 9px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer; background: var(--surface);
  transition: background .08s; user-select: none;
}
.topic-row:hover { background: #F5F7FA; }
.topic-row.selected { background: #FFF0F5; }
.topic-row.selected:hover { background: #FFE8F0; }

.tr-score {
  font-size: 16px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  text-align: center; color: var(--ink-3);
  flex-shrink: 0; line-height: 1; padding-left: 12px;
}
.tr-score.hi  { color: var(--pink); }
.tr-score.mid { color: var(--amber); }
.tr-score.lo  { color: var(--blue); }

.tr-ck {
  width: 14px; height: 14px; border-radius: 3px;
  border: 1.5px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 800; color: transparent;
  flex-shrink: 0; transition: all .1s;
}
.topic-row.selected .tr-ck { background: var(--pink); border-color: var(--pink); color: #fff; }

.tr-body { padding: 0 10px; min-width: 0; }
.tr-title { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.42; margin-bottom: 3px; }
.tr-tags { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tr-live {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); animation: blink 2s ease-in-out infinite;
  flex-shrink: 0; display: inline-block;
}
.tr-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
.b-google    { background: var(--green-lt);  color: var(--green); }
.b-exame     { background: var(--amber-lt);  color: var(--amber); }
.b-meioem    { background: var(--orange-lt); color: var(--orange); }
.b-infomoney { background: var(--blue-lt);   color: var(--blue); }
.b-curado    { background: var(--pink-lt);   color: var(--pink); }

.tr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.tr-vl { font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.tr-vbar { width: 40px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
.tr-vfill { height: 100%; border-radius: 2px; }

/* Skeleton */
.skel-row {
  display: grid; grid-template-columns: 36px 16px 1fr 52px;
  align-items: center; padding: 9px 12px 9px 0;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.skel { background: var(--border); border-radius: 2px; animation: sh 1.3s ease infinite; }
@keyframes sh { 0%,100%{opacity:.35} 50%{opacity:.7} }

/* ── PREVIEW PANEL ── */
.preview-panel {
  background: var(--surface);
  display: flex; flex-direction: column; overflow: hidden;
}
.pv-head {
  padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.pv-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); flex: 1; }
.pv-badge {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 20px; background: var(--pink-lt); color: var(--pink);
  border: 1px solid var(--pink-bdr); font-variant-numeric: tabular-nums;
}
.pv-nav { display: flex; align-items: center; gap: 2px; }
.pv-nav-btn {
  width: 22px; height: 22px; border-radius: var(--r);
  border: 1px solid var(--border-hi); background: transparent;
  color: var(--ink-2); font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
.pv-nav-btn:hover { background: var(--bg); }
.pv-nav-btn:disabled { opacity: .3; pointer-events: none; }

.pv-scroll {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent;
}
.pv-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 12px;
  padding: 32px; color: var(--ink-3); text-align: center;
}
.pv-empty-ico {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--bg); border: 1.5px dashed var(--border-hi);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.pv-empty-h { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.pv-empty-p { font-size: 12px; line-height: 1.6; }

.pv-content { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pv-topic-tag {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: var(--bg);
  border-radius: var(--r); border: 1px solid var(--border);
}
.pv-topic-label { font-size: 10px; font-weight: 600; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
.pv-topic-title { font-size: 11px; font-weight: 600; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pv-card { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; background: var(--panel); }
.pv-card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.pv-card-ico { font-size: 14px; }
.pv-card-plat { font-size: 11px; font-weight: 700; color: var(--ink); flex: 1; }
.pv-card-fmt {
  font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); background: var(--bg);
  padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border);
}
.pv-card-body { padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.pv-hook-label { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--pink); }
.pv-hook { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.6; font-style: italic; }
.pv-desc-label { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--pink); margin-top: 2px; }
.pv-desc { font-size: 12px; color: var(--ink-2); line-height: 1.75; }
.pv-cta-row {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r);
}
.pv-cta-icon { font-size: 12px; }
.pv-cta { font-size: 11px; font-weight: 600; color: var(--pink); flex: 1; line-height: 1.4; }

.pv-more-topics {
  padding: 8px 12px; background: var(--bg);
  border-radius: var(--r); border: 1px solid var(--border);
  font-size: 11px; color: var(--ink-2); font-weight: 500; text-align: center;
}

/* ── FOOTER ── */
.pv-footer {
  padding: 12px 14px; border-top: 1px solid var(--border);
  background: var(--panel); display: flex; flex-direction: column;
  gap: 8px; flex-shrink: 0;
}
.gen-btn {
  width: 100%; padding: 10px; border-radius: var(--r2);
  border: none; background: var(--pink); color: #fff;
  font-size: 13px; font-weight: 700; letter-spacing: -.01em;
  transition: opacity .12s, transform .08s;
}
.gen-btn:hover { opacity: .88; transform: translateY(-1px); }
.gen-btn:disabled { background: var(--border-hi); color: var(--ink-3); transform: none; opacity: 1; cursor: not-allowed; }
.gen-hint { font-size: 11px; color: var(--ink-3); text-align: center; line-height: 1.5; }

/* ── OUTPUT OVERLAY ── */
.out-overlay {
  position: fixed; inset: 0;
  background: rgba(8,10,16,.65); backdrop-filter: blur(6px);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.out-overlay[hidden] { display: none !important; }
.out-sheet {
  background: var(--surface); border: 1px solid var(--border-hi);
  border-bottom: none; border-radius: 8px 8px 0 0;
  width: 100%; max-width: 980px; max-height: 90vh;
  overflow-y: auto; display: flex; flex-direction: column;
}
.out-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.out-title { font-size: 14px; font-weight: 700; color: var(--ink); flex: 1; letter-spacing: -.01em; }
.out-close {
  width: 26px; height: 26px; border-radius: var(--r);
  background: var(--bg); border: 1px solid var(--border-hi);
  color: var(--ink-2); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
.out-close:hover { background: var(--border); }
.out-ctx { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--border); }
.ctx-chip { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: var(--bg); color: var(--ink-2); border: 1px solid var(--border-hi); }
.ctx-chip.pink { background: var(--pink-lt); color: var(--pink); border-color: var(--pink-bdr); }
.ideas-grid { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.idea-card { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; background: var(--panel); }
.idea-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.idea-ico { font-size: 14px; }
.idea-plat { font-size: 11px; font-weight: 700; color: var(--ink); flex: 1; }
.idea-fmt { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--bg); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); }
.idea-body { padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.idea-section-label { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); }
.idea-hook { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.55; font-style: italic; }
.idea-desc { font-size: 11px; color: var(--ink-2); line-height: 1.75; }
.idea-cta { font-size: 11px; font-weight: 700; color: var(--pink); display: flex; align-items: flex-start; gap: 5px; }
.idea-cta-label { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; margin-top: 1px; }
.idea-ref { font-size: 10px; color: var(--ink-3); border-top: 1px solid var(--border); padding-top: 8px; }
.out-regen-wrap { padding: 4px 20px 20px; }
.out-regen { width: 100%; padding: 9px; border: 1px solid var(--border-hi); border-radius: var(--r); background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 600; transition: border-color .1s, color .1s; }
.out-regen:hover { border-color: var(--pink); color: var(--pink); }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 48px 24px; color: var(--ink-2); }
.empty-icon { font-size: 24px; margin-bottom: 8px; }
.empty-h { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
.empty-p { font-size: 12px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 12px; font-weight: 600;
  padding: 7px 16px; border-radius: 20px; z-index: 300;
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 800px) {
  .body { grid-template-columns: 180px 1fr; }
  .preview-panel { display: none; }
}
@media (max-width: 560px) {
  .body { grid-template-columns: 1fr; }
  .zone-panel { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="app">

<!-- TOPBAR -->
<header class="topbar">
  <div class="t-brand">
    <div class="t-logo-sq">S</div>
    <span class="t-name">Sancho</span>
  </div>
  <span class="t-title">Gerador de Conteudo &middot; Wladson Sidney</span>
  <span class="t-upd" id="last-updated"></span>
  <button class="t-btn" id="refresh-btn"><span class="spin">&#8635;</span> Atualizar fontes</button>
</header>

<!-- BODY -->
<div class="body">

  <!-- 1. ZONES -->
  <div class="zone-panel">
    <div class="panel-head">
      <div class="panel-label">Zona de Genialidade</div>
      <div class="panel-sub">Selecione o angulo</div>
    </div>
    <div class="zones-list" id="zones-list"></div>
    <hr class="zone-divider">
    <div class="src-section" id="source-status">
      <div class="panel-label">Fontes</div>
      <div class="src-list"></div>
    </div>
  </div>

  <!-- 2. TOPICS -->
  <div class="topics-panel">
    <div class="filter-row" id="source-filter">
      <button class="f-btn active" data-filter="all">Todos</button>
      <button class="f-btn" data-filter="google">Google Trends</button>
      <button class="f-btn" data-filter="portais">Portais</button>
      <button class="f-btn" data-filter="curado">Curado</button>
    </div>
    <div class="topics-meta">
      <span class="tm-count" id="topic-count">...</span>
      <span class="tm-sel" id="sel-count" style="display:none"></span>
    </div>
    <div class="topics-scroll">
      <div id="topics-grid"></div>
    </div>
  </div>

  <!-- 3. PREVIEW -->
  <div class="preview-panel">
    <div class="pv-head">
      <span class="pv-label">Previa gerada</span>
      <span class="pv-badge" id="pv-badge" hidden>1 de 1</span>
      <div class="pv-nav">
        <button class="pv-nav-btn" id="pv-prev">&#8249;</button>
        <button class="pv-nav-btn" id="pv-next">&#8250;</button>
      </div>
    </div>
    <div class="pv-scroll" id="pv-scroll">
      <div class="pv-empty" id="pv-empty">
        <div class="pv-empty-ico">&#10022;</div>
        <div class="pv-empty-h">Nenhuma selecao</div>
        <div class="pv-empty-p">Escolha uma zona a esquerda e clique em um topico para ver a previa do conteudo.</div>
      </div>
      <div class="pv-content" id="pv-content" style="display:none"></div>

function clean(s){return(s||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();}
function rnd(n){return Math.floor(Math.random()*n);}
function has(text,kws){const t=(text||'').toLowerCase();return kws.some(k=>t.includes(k));}
function tagsFromDesc(d){return clean(d).split(/[,;\n]+/).map(s=>s.trim()).filter(s=>s.length>2&&s.length<32).slice(0,3);}
function guessTagsFromTitle(title){const t=(title||'').toLowerCase();const map=[['linkedin','linkedin'],['carreira','carreira'],['emprego','emprego'],['marca','branding'],['lideranca','lideranca'],['networking','networking'],['talento','talentos'],['executivo','c-level'],['empreendedor','empreend'],['mercado','mercado'],['comunicacao','comunicacao'],['trabalho','trabalho'],['salario','remuneracao']];return map.filter(([k])=>t.includes(k)).map(([,v])=>v).slice(0,3);}
function classifyZone(title,tags){const text=((title||'')+' '+(tags||[]).join(' ')).toLowerCase();let best=null,top=0;for(const[zid,kws]of Object.entries(ZONE_KW)){const score=kws.filter(k=>text.includes(k)).length;if(score>top){top=score;best=zid;}}return best||'carreiras';}

let allTopics=[],selectedTopics=new Set(),activeFilter='all',activeZone='',srcStatuses={},nextId=1,pvTopicIdx=0,pvTemplIdx=0;

async function fetchSource(src){
  setSrcStatus(src.id,'pend',0);
  try{
    const res=await fetch(src.url,{signal:AbortSignal.timeout(8000)});
    const json=await res.json();
    if(json.status!=='ok'||!Array.isArray(json.items))throw new Error();
    const topics=src.parse(json.items).map(p=>({id:nextId++,title:p.title,source:p.source,tags:p.tags||[],zone:classifyZone(p.title,p.tags),virality:p.viralityBase+rnd(4),live:p.live,link:p.link||null}));
    setSrcStatus(src.id,'ok',topics.length);return topics;
  }catch(e){setSrcStatus(src.id,'err',0);return[];}
}

async function loadAllTopics(){
  document.getElementById('refresh-btn').classList.add('loading');
  renderSkeletons();
  allTopics=CURATED.map(t=>({...t,id:nextId++}));
  setSrcStatus('curado','ok',CURATED.length);
  const results=await Promise.allSettled(SOURCES.map(s=>fetchSource(s)));
  results.forEach(r=>{if(r.status==='fulfilled')allTopics=[...allTopics,...r.value];});
  const seen=new Set();
  allTopics=allTopics.filter(t=>{const k=t.title.toLowerCase().slice(0,40);if(seen.has(k))return false;seen.add(k);return true;});
  ZONES.forEach(z=>{z.count=allTopics.filter(t=>t.zone===z.id).length;});
  renderZones();renderTopics();updateUI();
  const now=new Date();
  document.getElementById('last-updated').textContent=`Atualizado ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  document.getElementById('refresh-btn').classList.remove('loading');
  toast(`${allTopics.length} tendencias carregadas`);
}

function setSrcStatus(id,status,count){srcStatuses[id]={status,count};renderSrcStatus();}

function renderSrcStatus(){
  const container=document.getElementById('source-status');
  const all=[{id:'curado',label:'Curado Sancho'},...SOURCES.map(s=>({id:s.id,label:s.label}))];
  const rows=all.map(s=>{const st=srcStatuses[s.id]||{status:'pend',count:0};return`<div class="src-item"><span class="s-led ${st.status}"></span><span class="s-name">${s.label}</span>${st.status==='ok'?`<span class="s-ct">${st.count}</span>`:''}</div>`;}).join('');
  container.innerHTML=`<div class="panel-label">Fontes</div><div class="src-list">${rows}</div>`;
}

    btn.className='zone-btn'+(activeZone===z.id?' active':'');
    btn.dataset.id=z.id;
    btn.innerHTML=`<div class="z-icon">${z.icon}</div><div class="z-info"><div class="z-name">${z.label}</div><div class="z-ct">${z.count} topicos</div></div>`;
    btn.addEventListener('click',()=>{
      activeZone=z.id;
      document.querySelectorAll('.zone-btn').forEach(b=>{b.classList.toggle('active',b.dataset.id===z.id);});
      pvTopicIdx=0;pvTemplIdx=0;
      updateUI();renderPreview();
    });
    list.appendChild(btn);
  });
}

function renderSkeletons(){
  const grid=document.getElementById('topics-grid');
  grid.innerHTML=Array(14).fill('').map(()=>`<div class="skel-row"><div class="skel" style="height:16px;width:26px;margin:0 5px 0 12px"></div><div class="skel" style="height:13px;width:13px;border-radius:3px"></div><div style="padding:0 10px;display:flex;flex-direction:column;gap:5px"><div class="skel" style="height:11px;width:88%"></div><div class="skel" style="height:9px;width:50%"></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-right:12px"><div class="skel" style="height:9px;width:36px"></div><div class="skel" style="height:2px;width:40px"></div></div></div>`).join('');
  document.getElementById('topic-count').textContent='Carregando...';
}

function renderTopics(){
  const grid=document.getElementById('topics-grid');
  const filtered=allTopics.filter(t=>{if(activeFilter==='all')return true;const m=SOURCE_META[t.source];return m&&m.filter===activeFilter;});
  document.getElementById('topic-count').textContent=`${filtered.length} topicos`;
  grid.innerHTML='';
  if(!filtered.length){grid.innerHTML=`<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-h">Nenhum topico encontrado</div><div class="empty-p">Tente outro filtro ou atualize.</div></div>`;return;}
  [...filtered].sort((a,b)=>b.virality-a.virality).forEach(t=>{
    const sel=selectedTopics.has(t.id);
    const meta=SOURCE_META[t.source]||SOURCE_META['curado'];
    const sc=t.virality>=90?'hi':t.virality>=80?'mid':'lo';
    const fc=t.virality>=90?'var(--pink)':t.virality>=80?'var(--amber)':'var(--blue)';
    const vl=t.virality>=90?'Viral':t.virality>=80?'Em alta':'Crescendo';
    const row=document.createElement('div');
    row.className='topic-row'+(sel?' selected':'');
    row.dataset.id=t.id;
    row.innerHTML=`<div class="tr-score ${sc}">${t.virality}</div><div class="tr-ck">${sel?'✓':''}</div><div class="tr-body"><div class="tr-title">${t.title}</div><div class="tr-tags">${t.live?'<span class="tr-live"></span>':''}<span class="tr-badge ${meta.badgeCls}">${meta.badge}</span></div></div><div class="tr-right"><span class="tr-vl">${vl}</span><div class="tr-vbar"><div class="tr-vfill" style="width:${t.virality}%;background:${fc}"></div></div></div>`;
    row.addEventListener('click',()=>{
      if(selectedTopics.has(t.id)){selectedTopics.delete(t.id);row.classList.remove('selected');row.querySelector('.tr-ck').textContent='';row.querySelector('.tr-score').className='tr-score '+sc;}
      else{selectedTopics.add(t.id);row.classList.add('selected');row.querySelector('.tr-ck').textContent='✓';}
      pvTopicIdx=0;pvTemplIdx=0;
      updateUI();renderPreview();
    });
    grid.appendChild(row);
  });
}

function buildPreviewItems(){
  const topics=allTopics.filter(t=>selectedTopics.has(t.id));
  const pool=TEMPLATES[activeZone]||TEMPLATES.carreiras;
  const items=[];
  topics.forEach(topic=>{pool.forEach(tmpl=>{items.push({topic,tmpl});});});
  return items;
}

function renderPreview(){
  const empty=document.getElementById('pv-empty');
  const content=document.getElementById('pv-content');
  const badge=document.getElementById('pv-badge');
  const prevBtn=document.getElementById('pv-prev');
  const nextBtn=document.getElementById('pv-next');
  if(!activeZone||selectedTopics.size===0){empty.hidden=false;content.style.display='none';badge.hidden=true;prevBtn.disabled=true;nextBtn.disabled=true;return;}
  const items=buildPreviewItems();
  if(!items.length){empty.hidden=false;content.style.display='none';return;}
  const idx=Math.min(pvTopicIdx*2+pvTemplIdx,items.length-1);
  const{topic,tmpl}=items[idx];
  badge.hidden=false;badge.textContent=`${idx+1} de ${items.length}`;
  prevBtn.disabled=idx===0;nextBtn.disabled=idx===items.length-1;
  const abertura=tmpl.abertura(topic.title);
  const desenvolvimento=tmpl.desenvolvimento(topic.title);
  const provocacao=tmpl.provocacao(topic.title);
  const meta=SOURCE_META[topic.source]||SOURCE_META['curado'];
  const otherCount=selectedTopics.size-1;
  empty.hidden=true;content.style.display='flex';
  content.innerHTML=`<div class="pv-topic-tag"><span class="pv-topic-label">Topico</span><span class="pv-topic-title">${topic.title}</span><span class="tr-badge ${meta.badgeCls}">${meta.badge}</span></div><div class="pv-card"><div class="pv-card-head"><span class="pv-card-ico">${tmpl.icon}</span><span class="pv-card-plat">${tmpl.platform}</span><span class="pv-card-fmt">${tmpl.format}</span></div><div class="pv-card-body"><div class="pv-hook-label">ABERTURA</div><div class="pv-hook">${abertura}</div><div class="pv-desc-label">DESENVOLVIMENTO</div><div class="pv-desc">${desenvolvimento}</div><div class="pv-desc-label">PROVOCACAO</div><div class="pv-desc">${provocacao}</div><div class="pv-cta-row"><span class="pv-cta-icon">🎯</span><span class="pv-cta">${tmpl.cta}</span></div></div></div>${otherCount>0?`<div class="pv-more-topics">+${otherCount} topico${otherCount>1?'s':''} selecionado${otherCount>1?'s':''}. Use as setas para navegar.</div>`:''}`;
}

function updateUI(){
  const n=selectedTopics.size;
  const zone=ZONES.find(z=>z.id===activeZone);
  const btn=document.getElementById('gen-btn');
  const hint=document.getElementById('gen-hint');
  const selCount=document.getElementById('sel-count');
  selCount.textContent=n>0?`${n} selecionado${n>1?'s':''}` :'';
  selCount.style.display=n>0?'inline':'none';
  if(!activeZone&&n===0){btn.disabled=true;hint.textContent='Selecione uma zona e ao menos um topico';}
  else if(!activeZone){btn.disabled=true;hint.textContent='Selecione uma zona a esquerda';}
  else if(n===0){btn.disabled=true;hint.textContent='Clique em topicos para selecionar';}
  else{btn.disabled=false;hint.textContent=`${n} topico${n>1?'s':''} · ${zone.label}`;}
}

function generateContent(){
  const topics=allTopics.filter(t=>selectedTopics.has(t.id));
  const zone=ZONES.find(z=>z.id===activeZone);
  const pool=TEMPLATES[activeZone]||TEMPLATES.carreiras;
  document.getElementById('out-ctx').innerHTML=`<span class="ctx-chip">Wladson Sidney</span><span class="ctx-chip pink">${zone.icon} ${zone.label}</span>${topics.map(t=>`<span class="ctx-chip">📌 ${t.title.slice(0,45)}${t.title.length>45?'...':''}</span>`).join('')}`;
  const grid=document.getElementById('ideas-grid');
  grid.innerHTML='';
  topics.forEach(topic=>{
    const shuffled=[...pool].sort(()=>Math.random()-.5);
    shuffled.slice(0,2).forEach(tmpl=>{
      const card=document.createElement('div');
      card.className='idea-card';
      const meta=SOURCE_META[topic.source]||SOURCE_META['curado'];
      card.innerHTML=`<div class="idea-head"><span class="idea-ico">${tmpl.icon}</span><span class="idea-plat">${tmpl.platform}</span><span class="idea-fmt">${tmpl.format}</span></div><div class="idea-body"><div class="idea-section-label">ABERTURA</div><div class="idea-hook">${tmpl.abertura(topic.title)}</div><div class="idea-section-label">DESENVOLVIMENTO</div><div class="idea-desc">${tmpl.desenvolvimento(topic.title)}</div><div class="idea-section-label">PROVOCACAO</div><div class="idea-desc">${tmpl.provocacao(topic.title)}</div><div class="idea-cta"><span class="idea-cta-label">CTA</span> ${tmpl.cta}</div><div class="idea-ref">${topic.title.slice(0,55)}${topic.title.length>55?'...':''} · <span class="tr-badge ${meta.badgeCls}">${meta.badge}</span></div></div>`;
      grid.appendChild(card);
    });
  });
  document.getElementById('out-overlay').hidden=false;
  document.querySelector('.out-sheet').scrollTop=0;
}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}

document.getElementById('source-filter').addEventListener('click',e=>{const btn=e.target.closest('.f-btn');if(!btn)return;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.filter;renderTopics();});
document.getElementById('pv-prev').addEventListener('click',()=>{const items=buildPreviewItems();const cur=pvTopicIdx*2+pvTemplIdx;if(cur>0){const ni=cur-1;pvTopicIdx=Math.floor(ni/2);pvTemplIdx=ni%2;renderPreview();}});
document.getElementById('pv-next').addEventListener('click',()=>{const items=buildPreviewItems();const cur=pvTopicIdx*2+pvTemplIdx;if(cur<items.length-1){const ni=cur+1;pvTopicIdx=Math.floor(ni/2);pvTemplIdx=ni%2;renderPreview();}});
document.getElementById('gen-btn').addEventListener('click',generateContent);
document.getElementById('out-regen').addEventListener('click',generateContent);
document.getElementById('refresh-btn').addEventListener('click',loadAllTopics);
document.getElementById('out-close').addEventListener('click',()=>{document.getElementById('out-overlay').hidden=true;});
document.getElementById('out-overlay').addEventListener('click',e=>{if(e.target.id==='out-overlay')document.getElementById('out-overlay').hidden=true;});

CURATED.forEach(t=>allTopics.push({...t,id:nextId++}));
ZONES.forEach(z=>{z.count=allTopics.filter(t=>t.zone===z.id).length;});
renderZones();renderTopics();updateUI();renderPreview();renderSrcStatus();
loadAllTopics();
</script>
</body>
</html>
